<div class="profile-card">

    <!-- ============================ -->
    <!-- HEADER -->
    <!-- ============================ -->

    <div class="profile-header">

        <div class="profile-avatar-large">
            {{ studentAvatar }}
        </div>

        <div class="profile-user-meta">

            <h3>
                {{ studentName }}
            </h3>

            <p>
                Mã sinh viên: {{ studentCode }}

                <span *ngIf="studentFaculty">
                    | Khoa: {{ studentFaculty }}
                </span>
            </p>

        </div>

    </div>


    <!-- ============================ -->
    <!-- THÔNG BÁO THÀNH CÔNG -->
    <!-- ============================ -->

    <div
        *ngIf="successMessage"
        class="alert alert-success"
    >
        {{ successMessage }}
    </div>


    <!-- ============================ -->
    <!-- THÔNG BÁO LỖI -->
    <!-- ============================ -->

    <div
        *ngIf="errorMessage"
        class="alert alert-error"
    >
        {{ errorMessage }}
    </div>


    <!-- ============================ -->
    <!-- FORM -->
    <!-- ============================ -->

    <div class="form-grid">

        <!-- ============================ -->
        <!-- HỌ VÀ TÊN -->
        <!-- KHÔNG CHO PHÉP CHỈNH SỬA -->
        <!-- ============================ -->

        <div class="form-group">

            <label>
                Họ và tên
            </label>

            <input
                type="text"
                class="form-control"
                [value]="studentName"
                readonly
            >

        </div>


        <!-- ============================ -->
        <!-- MÃ SINH VIÊN -->
        <!-- KHÔNG CHO PHÉP CHỈNH SỬA -->
        <!-- ============================ -->

        <div class="form-group">

            <label>
                Mã sinh viên
            </label>

            <input
                type="text"
                class="form-control"
                [value]="studentCode"
                readonly
            >

        </div>


        <!-- ============================ -->
        <!-- EMAIL -->
        <!-- ============================ -->

        <div class="form-group">

            <label>
                Email sinh viên
            </label>

            <!-- Chế độ xem -->
            <input
                *ngIf="!isEditing"
                type="email"
                class="form-control"
                [value]="studentEmail"
                readonly
            >

            <!-- Chế độ chỉnh sửa -->
            <input
                *ngIf="isEditing"
                type="email"
                class="form-control"
                [(ngModel)]="editEmail"
                name="editEmail"
            >

        </div>


        <!-- ============================ -->
        <!-- LỚP -->
        <!-- ============================ -->

        <div class="form-group">

            <label>
                Lớp hành chính
            </label>

            <!-- Chế độ xem -->
            <input
                *ngIf="!isEditing"
                type="text"
                class="form-control"
                [value]="studentClass"
                readonly
            >

            <!-- Chế độ chỉnh sửa -->
            <input
                *ngIf="isEditing"
                type="text"
                class="form-control"
                [(ngModel)]="editClass"
                name="editClass"
            >

        </div>


        <!-- ============================ -->
        <!-- KHOA -->
        <!-- ============================ -->

        <div class="form-group">

            <label>
                Khoa
            </label>

            <!-- Chế độ xem -->
            <input
                *ngIf="!isEditing"
                type="text"
                class="form-control"
                [value]="studentFaculty"
                readonly
            >

            <!-- Chế độ chỉnh sửa -->
            <input
                *ngIf="isEditing"
                type="text"
                class="form-control"
                [(ngModel)]="editFaculty"
                name="editFaculty"
            >

        </div>

    </div>


    <!-- ============================ -->
    <!-- NÚT CHỈNH SỬA -->
    <!-- ============================ -->

    <div
        class="form-actions"
        *ngIf="!isEditing"
    >

        <button
            type="button"
            class="btn btn-primary"
            (click)="startEditing()"
        >
            Chỉnh sửa
        </button>

    </div>


    <!-- ============================ -->
    <!-- NÚT HỦY + LƯU -->
    <!-- ============================ -->

    <div
        class="form-actions"
        *ngIf="isEditing && hasChanges"
    >

        <button
            type="button"
            class="btn btn-outline"
            (click)="cancelEditing()"
            [disabled]="isSaving"
        >
            Hủy thay đổi
        </button>


        <button
            type="button"
            class="btn btn-primary"
            (click)="saveChanges()"
            [disabled]="isSaving"
        >

            Lưu thông tin

        </button>

    </div>

</div>
