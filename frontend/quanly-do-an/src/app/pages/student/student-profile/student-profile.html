
<div class="profile-card">

  <!-- THÔNG TIN SINH VIÊN -->
  <div class="profile-header">

    <div class="profile-avatar-large">
      {{ studentAvatar }}
    </div>

    <div class="profile-user-meta">
      <h3>{{ studentName }}</h3>

      <p>
        Mã sinh viên: {{ studentCode }}
        <span>| Khoa: {{ studentFaculty }}</span>
      </p>
    </div>

  </div>

  <!-- THÔNG BÁO THÀNH CÔNG -->
  <div
    *ngIf="successMessage"
    class="profile-notice profile-notice-success"
    role="status"
  >
    <span class="profile-notice-icon">✓</span>

    <span class="profile-notice-text">
      {{ successMessage }}
    </span>

    <button
      type="button"
      class="profile-notice-close"
      (click)="closeMessage()"
      aria-label="Đóng thông báo"
    >
      ×
    </button>
  </div>

  <!-- THÔNG BÁO LỖI -->
  <div
    *ngIf="errorMessage"
    class="profile-notice profile-notice-error"
    role="alert"
  >
    <span class="profile-notice-icon">!</span>

    <span class="profile-notice-text">
      {{ errorMessage }}
    </span>

    <button
      type="button"
      class="profile-notice-close"
      (click)="closeMessage()"
      aria-label="Đóng thông báo"
    >
      ×
    </button>
  </div>

  <!-- FORM THÔNG TIN -->
  <div class="form-grid">

    <!-- HỌ VÀ TÊN -->
    <div class="form-group">
      <label>Họ và tên</label>

      <input
        type="text"
        class="form-control"
        [value]="studentName"
        readonly
      >
    </div>

    <!-- MÃ SINH VIÊN -->
    <div class="form-group">
      <label>Mã sinh viên</label>

      <input
        type="text"
        class="form-control"
        [value]="studentCode"
        readonly
      >
    </div>

    <!-- EMAIL -->
    <div class="form-group">
      <label>Email sinh viên</label>

      <input
        type="email"
        class="form-control"
        [value]="studentEmail"
        readonly
      >
    </div>

    <!-- LỚP HÀNH CHÍNH -->
    <div class="form-group">
      <label>Lớp hành chính</label>

      <input
        *ngIf="!isEditing"
        type="text"
        class="form-control"
        [value]="studentClass"
        readonly
      >

      <input
        *ngIf="isEditing"
        type="text"
        class="form-control"
        [value]="editClass"
        (input)="onClassInput($event)"
        placeholder="Nhập lớp hành chính"
      >
    </div>

    <!-- KHOA -->
    <div class="form-group">
      <label>Khoa</label>

      <input
        *ngIf="!isEditing"
        type="text"
        class="form-control"
        [value]="studentFaculty"
        readonly
      >

      <input
        *ngIf="isEditing"
        type="text"
        class="form-control"
        [value]="editFaculty"
        (input)="onFacultyInput($event)"
        placeholder="Nhập khoa"
      >
    </div>

  </div>

  <!-- CHƯA CHỈNH SỬA -->
  <div
    class="form-actions"
    *ngIf="!isEditing"
  >
    <button
      type="button"
      class="btn btn-primary"
      (click)="startEditing()"
    >
      Chỉnh sửa
    </button>
  </div>

  <!-- ĐÃ CHỈNH SỬA VÀ CÓ THAY ĐỔI -->
  <div
    class="form-actions"
    *ngIf="isEditing && hasChangesNow"
  >
    <button
      type="button"
      class="btn btn-outline"
      (click)="cancelEditing()"
      [disabled]="isSaving"
    >
      Hủy thay đổi
    </button>

    <button
      type="button"
      class="btn btn-primary"
      (click)="saveChanges()"
      [disabled]="isSaving"
    >
      {{ isSaving ? 'Đang lưu...' : 'Lưu thông tin' }}
    </button>
  </div>

  <!-- CSS RIÊNG CHO THÔNG BÁO -->
  <style>
    .profile-notice {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 16px;
      margin: 18px 0;
      border-radius: 9px;
      border: 1px solid;
      font-size: 14px;
      line-height: 1.5;
    }

    .profile-notice-success {
      color: #166534;
      background: #f0fdf4;
      border-color: #bbf7d0;
    }

    .profile-notice-error {
      color: #991b1b;
      background: #fef2f2;
      border-color: #fecaca;
    }

    .profile-notice-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      border-radius: 50%;
      background: currentColor;
      font-weight: bold;
      font-size: 14px;
    }

    .profile-notice-success .profile-notice-icon {
      background: #16a34a;
      color: white;
    }

    .profile-notice-error .profile-notice-icon {
      background: #dc2626;
      color: white;
    }

    .profile-notice-text {
      flex: 1;
    }

    .profile-notice-close {
      border: none;
      background: transparent;
      color: inherit;
      font-size: 22px;
      cursor: pointer;
      line-height: 1;
      padding: 0 4px;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
  </style>

</div>
