
<div class="container">
  <form
    id="form-login"
    (submit)="onLogin($event)"
    novalidate
  >
    <h1>Đăng nhập</h1>
    <p class="auth-subtitle">
      Chào mừng bạn quay trở lại!
    </p>

    <div class="input-box">
      <label for="email">Email</label>

      <div class="input-field">
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          (input)="clearError()"
          placeholder="vidu@edu.vn"
          autocomplete="email"
          [disabled]="isLoading"
          required
        />
        <i class="bx bx-envelope field-icon"></i>
      </div>
    </div>

    <div class="input-box">
      <label for="password">Mật khẩu</label>

      <div class="input-field">
        <input
          [type]="showPassword ? 'text' : 'password'"
          id="password"
          name="password"
          [(ngModel)]="password"
          (input)="clearError()"
          placeholder="Nhập mật khẩu"
          autocomplete="current-password"
          [disabled]="isLoading"
          required
        />

        <button
          type="button"
          class="password-toggle"
          (click)="togglePassword()"
          [attr.aria-label]="showPassword ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'"
          [attr.aria-pressed]="showPassword"
          [disabled]="isLoading"
        >
          <i
            class="bx"
            [ngClass]="showPassword ? 'bx-show' : 'bx-hide'"
          ></i>
        </button>
      </div>
    </div>

    <div class="remember-forgot">
      <label>
        <input
          type="checkbox"
          name="remember"
          [(ngModel)]="remember"
        />
        Nhớ tài khoản
      </label>

      <span class="forgot-text">
        Quên mật khẩu?
      </span>
    </div>

    @if (errorMessage) {
      <div class="auth-alert error-message" role="alert">
        <i class="bx bx-error-circle"></i>
        <span>{{ errorMessage }}</span>
      </div>
    }

    <button
      type="submit"
      class="btn"
      [disabled]="isLoading"
    >
      @if (isLoading) {
        <span class="btn-spinner"></span>
        Đang đăng nhập...
      } @else {
        Đăng nhập
        <i class="bx bx-right-arrow-alt"></i>
      }
    </button>

    <div class="register-link">
      <p>
        Chưa có tài khoản?
        <a routerLink="/register">Đăng ký ngay</a>
      </p>
    </div>

    <div class="divider">
      <div class="line-left"></div>
      <span>hoặc</span>
      <div class="line-right"></div>
    </div>

    <div class="social-login">
      <a
        href="javascript:void(0)"
        class="gmail"
        aria-label="Google"
      >
        <img src="google.png" alt="Google" />
      </a>

      <a
        href="javascript:void(0)"
        class="mezon"
        aria-label="Discord"
      >
        <img src="discord.png" alt="Discord" />
      </a>
    </div>

    <div class="notice">
      <p>
        Bằng việc tiếp tục, bạn đồng ý với
        Chính sách bảo mật của hệ thống.
      </p>
    </div>
  </form>
</div>
