<div class="container">
  <form
    (submit)="onLogin($event)"
    id="form-login"
  >
    <h1>Đăng nhập</h1>

    <div class="input-box">
      <label for="email">Email</label>

      <input
        type="email"
        id="email"
        name="email"
        [(ngModel)]="email"
        placeholder="vidu@edu.vn"
        autocomplete="email"
        required
      />

      <i class="bx bx-envelope"></i>
    </div>

    <div class="input-box">
      <label for="password">Mật khẩu</label>

      <input
        type="password"
        id="password"
        name="password"
        [(ngModel)]="password"
        placeholder="••••••••"
        autocomplete="current-password"
        required
      />

      <i class="bx bx-lock-alt"></i>
    </div>

    <div class="remember-forgot">
      <label>
        <input
          type="checkbox"
          name="remember"
          [(ngModel)]="remember"
        />
        Nhớ tài khoản
      </label>

      <a>Quên mật khẩu?</a>
    </div>

    <!-- Thông báo lỗi -->
    @if (errorMessage) {
      <div class="error-message">
        {{ errorMessage }}
      </div>
    }

    <button
      type="submit"
      class="btn"
      name="btn_login"
      value="login"
      [disabled]="isLoading"
    >
      {{ isLoading ? 'Đang đăng nhập...' : 'Đăng nhập' }}
    </button>

    <div class="register-link">
      <p>
        Chưa có tài khoản?
        <a routerLink="/register">
          Đăng ký ngay
        </a>
      </p>
    </div>

    <div class="divider">
      <div class="line-left"></div>
      <span>hoặc</span>
      <div class="line-right"></div>
    </div>

    <div class="social-login">
      <a
        href="javascript:void(0)"
        class="gmail"
      >
        <img
          src="google.png"
          alt="Google"
        />
      </a>

      <a
        href="javascript:void(0)"
        class="mezon"
      >
        <img
          src="discord.png"
          alt="Discord"
        />
      </a>
    </div>

    <div class="notice">
      <p>
        Bằng việc tiếp tục, bạn đồng ý với
        <a>Chính sách bảo mật</a>
        của chúng tôi
      </p>
    </div>
  </form>
</div>
